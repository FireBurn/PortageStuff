# The ebuild turns the NSS modules on for everything that is not musl:
#
#   $(meson_use !elibc_musl nss-myhostname)
#
# This libc has no name service switch at all, and no <nss.h> to build one
# against, so the modules are turned off here the way they would be for musl.
# MYMESONARGS is appended after the ebuild's own arguments, so it wins.
MYMESONARGS="-Dnss-myhostname=false -Dnss-mymachines=disabled -Dnss-resolve=disabled -Dnss-systemd=false"
