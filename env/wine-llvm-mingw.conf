# The PE side is built by dev-util/llvm-mingw64 rather than a GCC cross
# compiler, so the eclass check for ${triple}-gcc has nothing to find and
# is told not to look. CROSSCC names the compiler it should use instead.
MINGW_BYPASS=1
CROSSCC_amd64="/usr/local/bin/x86_64-w64-mingw32-clang-lto"
CROSSCXX_amd64="/usr/lib/llvm-mingw64/bin/x86_64-w64-mingw32-clang++"
CROSSCC_x86="/usr/local/bin/i686-w64-mingw32-clang-lto"
CROSSCXX_x86="/usr/lib/llvm-mingw64/bin/i686-w64-mingw32-clang++"

# The cross link must not get the ELF linker flags of make.conf: --as-needed
# and --build-id mean something else to a PE link, and the DLLs came out with
# extra .text and .rdata sections that the loader then jumped into.
CROSSLDFLAGS="-fuse-ld=lld"

# wine-preloader is linked static at 0x7d7d00000000, above 4GB. With LTO the
# code is generated at link time, and for a non-PIE link that means the static
# relocation model and 32-bit absolute addresses, which cannot reach it. The
# bashrc keeps the relocation model the objects were compiled with, -fPIE.
WINE_PRELOADER_PIC=1

# The PE side is built with thin LTO. The wrappers add -flto=thin to the
# compiler itself, because wine puts CROSSCFLAGS after the per-file flags and
# the files that cannot be LTO (patches/app-emulation/wine-staging/wine-pe-lto.patch)
# need their -fno-lto to come later.
CROSSCFLAGS="-O3 -march=native -pipe -Wno-incompatible-function-pointer-types -Wno-int-conversion -Wno-unused-but-set-global"
CROSSCXXFLAGS="${CROSSCFLAGS}"
