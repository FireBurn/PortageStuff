# libstdc++'s headers include each other freely, and code written against it
# uses std::function, std::back_inserter, std::free and the like without
# including what declares them. libc++ declares them only in their own
# headers, so libcxx-compat.h gives them to every C++ file. It is one token so
# that rocm.eclass, which tests CXXFLAGS one flag at a time, keeps it.
CXXFLAGS="${CXXFLAGS} -Wp,-include,/etc/portage/libcxx-compat.h"
