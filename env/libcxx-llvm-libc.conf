# libc++ picks its locale support by the C library it is told it has, and
# the ebuild only ever says glibc or musl. Left at "system", libc++ uses the
# glibc support, which calls iswalpha_l and the rest that llvm-libc does not
# provide. MYCMAKEARGS is appended after the ebuild's own arguments.
MYCMAKEARGS="-DRUNTIMES_USE_LIBC=llvm-libc"
