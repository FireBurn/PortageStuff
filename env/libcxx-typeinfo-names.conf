# std::any_cast asks the code that built the any to compare the types, and
# libc++ compares type_info by address unless told otherwise. Plugins loaded
# RTLD_LOCAL each carry their own type_info for a pointer to an incomplete type,
# so an any made in one is rejected by another.
CXXFLAGS="${CXXFLAGS} -D_LIBCPP_TYPEINFO_COMPARISON_IMPLEMENTATION=2"
