# Not enabled in package.env: for building libc with -march=native -O3 and
# ThinLTO to test it without installing it. The tests are kept out of LTO or
# they inline the library and fold what they are checking.
CFLAGS="-march=native -O3 -pipe -flto=thin -Wno-incompatible-function-pointer-types -Wno-int-conversion -Wno-unused-but-set-global"
CXXFLAGS="${CFLAGS}"
CMAKE_EXTRA_CACHE_FILE="/etc/portage/libc-lto-cache.cmake"
