# libsandbox is preloaded into every process a build starts, glibc ones
# included. The patch lets one library serve both libcs; this turns it on.
CPPFLAGS="${CPPFLAGS} -DSB_LIBC_NEUTRAL"
# Link no libc, and build without exception tables, as unwinding through the
# library would need an unwinder the glibc process may not have.
MAKEOPTS="${MAKEOPTS} SB_NEUTRAL_LDFLAGS=-Wc,-nodefaultlibs SB_NEUTRAL_LIBADD=-Wl,-z,undefs CFLAG_EXCEPTIONS=-fno-exceptions"
