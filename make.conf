# These settings were set by the catalyst build script that automatically built this stage
# Please consult /etc/make.conf.example for a more detailed example

CFLAGS="-O3 -march=native -pipe -flto=16"
CXXFLAGS="${CFLAGS}"
LDFLAGS="-Wl,-O1 -Wl,--as-needed -Wl,--hash-style=gnu -flto=16"

RUSTFLAGS='-C target-cpu=native'

MAKEOPTS="-j16"

ACCEPT_KEYWORDS="~amd64"

USE="avif bluetooth brightness-control cacert clang clippy connection-sharing
     custom-cflags dav1d default-gold default-lld default-ucrt dns-over-tls
     dri3 drm egl epub faudio ffmpeg fontforge gamepad gamescope gbm gold
     googledrive graphite gstreamer harfbuzz hires http2 http3 icu io-uring
     journald ktls libglvnd libmpv lm-sensors lto lzma lzo mobi mpris nat
     ncat networkmanager nftables nightly nsplugin ompt openal openssl opus
     parallel-compiler pcre pcre-jit pdfimport pipewire pipewire-alsa
     postproc prometheus-exporter pulseaudio qt6 quic rust-src rustfmt samba
     scp screencast spirv system-harfbuzz system-icu system-llvm theora
     threads thumbnail touchpad upnp v4l vaapi vpx vulkan wayland webp wifi
     woff2 x265 xkb xxhash zstd -cdda -debuginfod -desktop-portal -dvd
     -espeak -gnome-keyring -ispc -kwallet -lua -mbim -qt5 -rsync-verify -sdl
     -semantic-desktop -sysprof -vlc"

CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

GENTOO_MIRRORS="https://www.mirrorservice.org/sites/distfiles.gentoo.org/ https://mirror.rackspace.com/gentoo/ http://gentoo.osuosl.org ${GENTOO_MIRRORS}" 

VIDEO_CARDS="radeonsi amdgpu llvmpipe"

LLVM_TARGETS="AMDGPU"

LLVM_SLOT="23"

LUA_SINGLE_TARGET="lua5-4"

INPUT_DEVICES="libinput"

LINGUAS="en_GB en"
L10N="en-GB en"

PERL_FEATURES="ithreads"

PORTAGE_NICENESS=19

RUBY_TARGETS="ruby40"

PYTHON_SINGLE_TARGET="python3_14"

PYTHON_TARGETS="python3_14"

APACHE2_MODULES="${APACHE2_MODULES} access_compat"

PORTAGE_ECLASS_WARNING_ENABLE="0"

I_PROMISE_TO_SUPPLY_PATCHES_WITH_BUGS=1

EMERGE_DEFAULT_OPTS="--autounmask-write --with-bdeps y --complete-graph y --keep-going --implicit-system-deps=n"

PORTDIR="/usr/portage"
PORTAGE_WORKDIR_MODE="0770"

ACCEPT_LICENSE="*"

